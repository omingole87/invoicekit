name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck monorepo
        run: npm run typecheck

      - name: Run WCAG AA contrast & renderer tests
        run: npm test

      - name: Build docs and playground site
        run: npm --workspace=@invoicekit/docs run build

      - name: Verify package packaging
        run: |
          npm pack --workspace=@invoicekit/tokens
          npm pack --workspace=@invoicekit/ui
          npm pack --workspace=@invoicekit/renderer
